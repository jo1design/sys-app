<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="390" height="844" fill="#111111"/>

  <!-- Status bar -->
  <text x="32" y="20" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="298" y="10" width="25" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="300" y="12" width="18" height="8" rx="1.5" fill="#FFFFFF"/>
  <rect x="324" y="14" width="2" height="5" rx="1" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="24" y="62" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#9A9A9A">Annuler</text>
  <text x="195" y="62" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Modifier le profil</text>
  <text x="358" y="62" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#C5FF00" text-anchor="end">Enregistrer</text>
  <line x1="0" y1="76" x2="390" y2="76" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Avatar -->
  <circle cx="195" cy="130" r="45" fill="#252525" stroke="#C5FF00" stroke-width="2"/>
  <text x="195" y="138" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle">A</text>
  <!-- Camera icon overlay -->
  <circle cx="225" cy="163" r="15" fill="#C5FF00" stroke="#111111" stroke-width="2"/>
  <text x="225" y="168" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="12" fill="#0A0A0A" text-anchor="middle">📷</text>
  <!-- Change photo text -->
  <text x="195" y="200" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#C5FF00" text-anchor="middle">Changer la photo</text>

  <!-- Pseudo field -->
  <text x="24" y="240" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9A9A9A">Pseudo</text>
  <rect x="24" y="250" width="342" height="48" rx="10" fill="#1E1E1E" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="52" y="280" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#FFFFFF">@  AlexPadel</text>
  <text x="24" y="314" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" fill="#555555">Visible par tous les membres de la communauté</text>

  <!-- Club field -->
  <text x="24" y="346" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9A9A9A">Club</text>
  <rect x="24" y="356" width="342" height="48" rx="10" fill="#1E1E1E" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="52" y="386" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#FFFFFF">📍  Club du Lac</text>

  <!-- Sports section -->
  <text x="24" y="436" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9A9A9A">Sports pratiqués</text>

  <!-- Sport toggles -->
  <rect x="24" y="452" width="80" height="34" rx="17" fill="rgba(197,255,0,0.15)" stroke="#C5FF00" stroke-width="1.5"/>
  <text x="64" y="474" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#C5FF00" text-anchor="middle">🏓 Padel ✓</text>

  <rect x="112" y="452" width="88" height="34" rx="17" fill="rgba(197,255,0,0.15)" stroke="#C5FF00" stroke-width="1.5"/>
  <text x="156" y="474" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#C5FF00" text-anchor="middle">🎾 Tennis ✓</text>

  <rect x="208" y="452" width="98" height="34" rx="17" fill="#1A1A1A" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="257" y="474" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9A9A9A" text-anchor="middle">🏓 Ping-Pong</text>

  <rect x="24" y="494" width="82" height="34" rx="17" fill="#1A1A1A" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="65" y="516" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9A9A9A" text-anchor="middle">🟡 Squash</text>

  <rect x="114" y="494" width="100" height="34" rx="17" fill="#1A1A1A" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="164" y="516" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9A9A9A" text-anchor="middle">🏸 Badminton</text>

  <!-- Danger zone -->
  <line x1="24" y1="570" x2="366" y2="570" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="24" y="600" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#555555" letter-spacing="1">ZONE DANGER</text>

  <!-- Logout button -->
  <rect x="24" y="620" width="342" height="48" rx="10" fill="rgba(255,59,48,0.06)" stroke="rgba(255,59,48,0.19)" stroke-width="1"/>
  <text x="195" y="650" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#FF3B30" text-anchor="middle">🚪 Se déconnecter</text>

  <!-- Delete account button -->
  <rect x="24" y="676" width="342" height="48" rx="10" fill="rgba(255,59,48,0.06)" stroke="rgba(255,59,48,0.19)" stroke-width="1"/>
  <text x="195" y="706" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#FF3B30" text-anchor="middle">🗑 Supprimer mon compte</text>

  <!-- Bottom indicator -->
  <rect x="147" y="818" width="96" height="5" rx="2.5" fill="#FFFFFF" opacity="0.2"/>
</svg>