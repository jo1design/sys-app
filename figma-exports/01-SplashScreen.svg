<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="390" height="844" fill="#111111"/>

  <!-- Decorative gradient circles -->
  <circle cx="320" cy="200" r="180" fill="#C5FF00" opacity="0.06"/>
  <circle cx="70" cy="650" r="150" fill="#C5FF00" opacity="0.04"/>
  <circle cx="195" cy="350" r="100" fill="#C5FF00" opacity="0.03"/>

  <!-- Status bar area -->
  <text x="32" y="20" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="298" y="10" width="25" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="300" y="12" width="18" height="8" rx="1.5" fill="#FFFFFF"/>
  <rect x="324" y="14" width="2" height="5" rx="1" fill="#FFFFFF"/>

  <!-- Logo area - centered -->
  <!-- Racket icon stylized -->
  <g transform="translate(145, 260)">
    <!-- Racket outline -->
    <ellipse cx="50" cy="45" rx="42" ry="50" fill="none" stroke="#C5FF00" stroke-width="3.5"/>
    <!-- Racket strings horizontal -->
    <line x1="14" y1="25" x2="86" y2="25" stroke="#C5FF00" stroke-width="1.2" opacity="0.5"/>
    <line x1="11" y1="35" x2="89" y2="35" stroke="#C5FF00" stroke-width="1.2" opacity="0.5"/>
    <line x1="9" y1="45" x2="91" y2="45" stroke="#C5FF00" stroke-width="1.2" opacity="0.5"/>
    <line x1="11" y1="55" x2="89" y2="55" stroke="#C5FF00" stroke-width="1.2" opacity="0.5"/>
    <line x1="14" y1="65" x2="86" y2="65" stroke="#C5FF00" stroke-width="1.2" opacity="0.5"/>
    <!-- Racket strings vertical -->
    <line x1="30" y1="2" x2="30" y2="90" stroke="#C5FF00" stroke-width="1.2" opacity="0.5"/>
    <line x1="42" y1="0" x2="42" y2="93" stroke="#C5FF00" stroke-width="1.2" opacity="0.5"/>
    <line x1="54" y1="0" x2="54" y2="93" stroke="#C5FF00" stroke-width="1.2" opacity="0.5"/>
    <line x1="66" y1="2" x2="66" y2="90" stroke="#C5FF00" stroke-width="1.2" opacity="0.5"/>
    <!-- Handle -->
    <rect x="42" y="90" width="16" height="45" rx="5" fill="none" stroke="#C5FF00" stroke-width="3"/>
    <!-- Ball -->
    <circle cx="78" cy="18" r="10" fill="#C5FF00"/>
  </g>

  <!-- App name -->
  <text x="195" y="420" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">SYS</text>

  <!-- Full name -->
  <text x="195" y="455" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="16" font-weight="500" fill="#C5FF00" text-anchor="middle" letter-spacing="4">STREAM YOUR SPORT</text>

  <!-- Tagline -->
  <text x="195" y="495" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="400" fill="#9A9A9A" text-anchor="middle">Le Strava des sports de raquette</text>

  <!-- CTA Buttons -->
  <!-- Primary Button - Creer un compte -->
  <rect x="32" y="640" width="326" height="56" rx="20" fill="#C5FF00"/>
  <text x="195" y="674" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0A0A0A" text-anchor="middle">Creer un compte</text>

  <!-- Secondary Button - Se connecter -->
  <rect x="32" y="712" width="326" height="56" rx="20" fill="none" stroke="#C5FF00" stroke-width="2"/>
  <text x="195" y="746" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="700" fill="#C5FF00" text-anchor="middle">Se connecter</text>

  <!-- Bottom indicator -->
  <rect x="147" y="818" width="96" height="5" rx="2.5" fill="#FFFFFF" opacity="0.2"/>
</svg>