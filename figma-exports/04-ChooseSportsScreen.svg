  <text x="24" y="132" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Tes sports</text>
  <text x="24" y="158" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#9A9A9A">Choisis les sports que tu pratiques.</text>
  <text x="24" y="176" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#9A9A9A">Tu pourras en ajouter plus tard.</text>

  <!-- Sport card: Tennis (unselected) -->
  <rect x="24" y="204" width="162" height="120" rx="14" fill="#1A1A1A" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <text x="40" y="268" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="32">🎾</text>
  <text x="40" y="294" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Tennis</text>
  <text x="40" y="310" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" fill="#555555">Tennis de table, simple</text>

  <!-- Sport card: Padel (selected) -->
  <rect x="198" y="204" width="162" height="120" rx="14" fill="rgba(197,255,0,0.08)" stroke="#C5FF00" stroke-width="2"/>
  <!-- Check mark -->
  <circle cx="338" cy="222" r="11" fill="#C5FF00"/>
  <text x="338" y="227" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="12" font-weight="900" fill="#0A0A0A" text-anchor="middle">✓</text>
  <text x="214" y="268" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="32">🏓</text>
  <text x="214" y="294" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="700" fill="#C5FF00">Padel</text>
  <text x="214" y="310" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" fill="#555555">Padel en salle ou ext.</text>

  <!-- Sport card: Ping-Pong (unselected) -->
  <rect x="24" y="336" width="162" height="120" rx="14" fill="#1A1A1A" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <text x="40" y="400" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="32">🏓</text>
  <text x="40" y="426" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Ping-Pong</text>
  <text x="40" y="442" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" fill="#555555">Ping-pong en club</text>

  <!-- Sport card: Squash (unselected) -->
  <rect x="198" y="336" width="162" height="120" rx="14" fill="#1A1A1A" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <text x="214" y="400" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="32">🟡</text>
  <text x="214" y="426" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Squash</text>
  <text x="214" y="442" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" fill="#555555">Squash en box fermé</text>

