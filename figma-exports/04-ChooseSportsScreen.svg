  <text x="250" y="690" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" fill="#0A0A0A">→</text>

  <!-- Skip link -->
  <text x="195" y="740" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#555555" text-anchor="middle">Passer cette étape</text>

  <!-- Bottom indicator -->
  <rect x="147" y="818" width="96" height="5" rx="2.5" fill="#FFFFFF" opacity="0.2"/>
