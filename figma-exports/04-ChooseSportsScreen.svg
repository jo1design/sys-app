  <rect x="24" y="468" width="162" height="120" rx="14" fill="#1A1A1A" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <text x="40" y="532" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="32">🏸</text>
  <text x="40" y="558" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Badminton</text>
  <text x="40" y="574" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" fill="#555555">Badminton en salle</text>

  <!-- Selected count -->
  <text x="195" y="628" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#C5FF00" text-anchor="middle">1 sport sélectionné</text>

  <!-- Continue button -->
  <rect x="24" y="656" width="342" height="56" rx="16" fill="#C5FF00"/>
