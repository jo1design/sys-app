  <rect x="298" y="10" width="25" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="300" y="12" width="18" height="8" rx="1.5" fill="#FFFFFF"/>
  <rect x="324" y="14" width="2" height="5" rx="1" fill="#FFFFFF"/>

  <!-- Progress dots (2 of 4 active) -->
  <rect x="24" y="60" width="81" height="4" rx="2" fill="#C5FF00"/>
  <rect x="111" y="60" width="81" height="4" rx="2" fill="#C5FF00"/>
  <rect x="198" y="60" width="81" height="4" rx="2" fill="#252525"/>
  <rect x="285" y="60" width="81" height="4" rx="2" fill="#252525"/>

