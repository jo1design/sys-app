<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="390" height="844" fill="#111111"/>

  <!-- Status bar -->
  <text x="32" y="20" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="298" y="10" width="25" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="300" y="12" width="18" height="8" rx="1.5" fill="#FFFFFF"/>
  <rect x="324" y="14" width="2" height="5" rx="1" fill="#FFFFFF"/>

  <!-- Back button -->
  <text x="24" y="68" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="22" fill="#FFFFFF">‹</text>

  <!-- Logo mini -->
  <rect x="169" y="120" width="52" height="52" rx="16" fill="#C5FF00"/>
  <text x="195" y="153" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="18" fill="#0A0A0A" text-anchor="middle" font-weight="700">▶</text>

  <!-- Title -->
  <text x="195" y="208" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">Connexion</text>
  <text x="195" y="236" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#9A9A9A" text-anchor="middle">Content de te revoir 👋</text>

  <!-- SSO Google -->
  <rect x="32" y="276" width="326" height="52" rx="14" fill="#252525" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="170" y="308" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF">G</text>
  <text x="195" y="308" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF">Continuer avec Google</text>

  <!-- SSO Apple -->
  <rect x="32" y="336" width="326" height="52" rx="14" fill="#252525" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="170" y="368" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF"></text>
  <text x="195" y="368" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF">Continuer avec Apple</text>

  <!-- Divider -->
  <line x1="32" y1="416" x2="155" y2="416" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="195" y="420" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" fill="#555555" text-anchor="middle">ou par email</text>
  <line x1="235" y1="416" x2="358" y2="416" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Email field -->
  <text x="32" y="460" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9A9A9A">Email</text>
  <rect x="32" y="470" width="326" height="48" rx="10" fill="#1E1E1E" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="60" y="500" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#555555">✉  ton@email.com</text>

  <!-- Password field -->
  <text x="32" y="546" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9A9A9A">Mot de passe</text>
  <rect x="32" y="556" width="326" height="48" rx="10" fill="#1E1E1E" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="60" y="586" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#555555">🔒  ••••••••</text>

  <!-- Forgot password -->
  <text x="358" y="628" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" fill="#C5FF00" text-anchor="end">Mot de passe oublié ?</text>

  <!-- Login button -->
  <rect x="32" y="660" width="326" height="56" rx="16" fill="#C5FF00"/>
  <text x="195" y="694" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0A0A0A" text-anchor="middle">Se connecter</text>

  <!-- Footer -->
  <text x="155" y="740" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#9A9A9A">Pas encore de compte ?</text>
  <text x="320" y="740" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#C5FF00">Créer un compte</text>

  <!-- Bottom indicator -->
  <rect x="147" y="818" width="96" height="5" rx="2.5" fill="#FFFFFF" opacity="0.2"/>
</svg>