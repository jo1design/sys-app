<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="390" height="844" fill="#111111"/>

  <!-- Status bar -->
  <text x="32" y="20" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="298" y="10" width="25" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="300" y="12" width="18" height="8" rx="1.5" fill="#FFFFFF"/>
  <rect x="324" y="14" width="2" height="5" rx="1" fill="#FFFFFF"/>

  <!-- Progress dots (4 of 4 active) -->
  <rect x="24" y="60" width="81" height="4" rx="2" fill="#C5FF00"/>
  <rect x="111" y="60" width="81" height="4" rx="2" fill="#C5FF00"/>
  <rect x="198" y="60" width="81" height="4" rx="2" fill="#C5FF00"/>
  <rect x="285" y="60" width="81" height="4" rx="2" fill="#C5FF00"/>

  <!-- Bell icon with glow -->
  <circle cx="195" cy="160" r="55" fill="rgba(197,255,0,0.15)"/>
  <text x="195" y="175" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="52" fill="#C5FF00" text-anchor="middle">🔔</text>

  <!-- Step label -->
  <text x="195" y="240" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#C5FF00" text-anchor="middle" letter-spacing="1">ÉTAPE 3 SUR 3</text>

  <!-- Title -->
  <text x="195" y="274" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">Ne rate rien !</text>

  <!-- Subtitle -->
  <text x="195" y="302" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#9A9A9A" text-anchor="middle">Active les notifications pour suivre les</text>
  <text x="195" y="322" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#9A9A9A" text-anchor="middle">matchs en direct et l'activité de ta communauté.</text>

  <!-- Example notification 1: Match en direct -->
  <rect x="24" y="356" width="342" height="56" rx="10" fill="#1A1A1A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="54" cy="384" r="18" fill="rgba(255,59,48,0.13)"/>
  <text x="54" y="389" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="14" fill="#FF3B30" text-anchor="middle">📡</text>
  <text x="82" y="377" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#9A9A9A" letter-spacing="0.5">MATCH EN DIRECT</text>
  <text x="82" y="395" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" fill="#FFFFFF">SofiaM vient de commencer un match</text>

  <!-- Example notification 2: Moment fort -->
  <rect x="24" y="420" width="342" height="56" rx="10" fill="#1A1A1A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="54" cy="448" r="18" fill="rgba(197,255,0,0.13)"/>
  <text x="54" y="453" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="14" fill="#C5FF00" text-anchor="middle">⭐</text>
  <text x="82" y="441" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#9A9A9A" letter-spacing="0.5">MOMENT FORT</text>
  <text x="82" y="459" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" fill="#FFFFFF">MaxBouleau a marqué un point de ouf !</text>

  <!-- Example notification 3: Like -->
  <rect x="24" y="484" width="342" height="56" rx="10" fill="#1A1A1A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="54" cy="512" r="18" fill="rgba(255,55,95,0.13)"/>
  <text x="54" y="517" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="14" fill="#FF375F" text-anchor="middle">❤</text>
  <text x="82" y="505" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#9A9A9A" letter-spacing="0.5">LIKE</text>
  <text x="82" y="523" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" fill="#FFFFFF">RaphaelDupont a aimé votre match</text>

  <!-- Example notification 4: Replay -->
  <rect x="24" y="548" width="342" height="56" rx="10" fill="#1A1A1A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="54" cy="576" r="18" fill="rgba(154,154,154,0.13)"/>
  <text x="54" y="581" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="14" fill="#9A9A9A" text-anchor="middle">▶</text>
  <text x="82" y="569" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#9A9A9A" letter-spacing="0.5">REPLAY DISPO</text>
  <text x="82" y="587" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" fill="#FFFFFF">Votre match est disponible en replay</text>

  <!-- Enable notifications button -->
  <rect x="24" y="660" width="342" height="56" rx="16" fill="#C5FF00"/>
  <text x="195" y="694" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0A0A0A" text-anchor="middle">🔔  Activer les notifications</text>

  <!-- Skip link -->
  <text x="195" y="740" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#9A9A9A" text-anchor="middle">Plus tard</text>

  <!-- Legal text -->
  <text x="195" y="772" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Tu pourras modifier tes préférences</text>
  <text x="195" y="788" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" fill="#555555" text-anchor="middle">dans les paramètres à tout moment.</text>

  <!-- Bottom indicator -->
  <rect x="147" y="818" width="96" height="5" rx="2.5" fill="#FFFFFF" opacity="0.2"/>
</svg>