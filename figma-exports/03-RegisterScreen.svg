<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="390" height="844" fill="#111111"/>

  <!-- Status bar -->
  <text x="32" y="20" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="298" y="10" width="25" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="300" y="12" width="18" height="8" rx="1.5" fill="#FFFFFF"/>
  <rect x="324" y="14" width="2" height="5" rx="1" fill="#FFFFFF"/>

  <!-- Back button -->
  <text x="24" y="68" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="22" fill="#FFFFFF">‹</text>

  <!-- Progress dots (1 of 4 active) -->
  <rect x="24" y="86" width="81" height="4" rx="2" fill="#C5FF00"/>
  <rect x="111" y="86" width="81" height="4" rx="2" fill="#252525"/>
  <rect x="198" y="86" width="81" height="4" rx="2" fill="#252525"/>
  <rect x="285" y="86" width="81" height="4" rx="2" fill="#252525"/>

  <!-- Title -->
  <text x="24" y="130" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Créer un compte</text>
  <text x="24" y="155" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#9A9A9A">Rejoins la communauté en moins de 2 minutes</text>

  <!-- SSO Google -->
  <rect x="24" y="186" width="342" height="52" rx="14" fill="#252525" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="195" y="218" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle">Inscription avec Google</text>

  <!-- SSO Apple -->
  <rect x="24" y="246" width="342" height="52" rx="14" fill="#252525" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="195" y="278" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle">Inscription avec Apple</text>

  <!-- Divider -->
  <line x1="24" y1="322" x2="155" y2="322" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="195" y="326" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" fill="#555555" text-anchor="middle">ou par email</text>
  <line x1="235" y1="322" x2="366" y2="322" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Pseudo field -->
  <text x="24" y="362" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9A9A9A">Pseudo *</text>
  <rect x="24" y="372" width="342" height="48" rx="10" fill="#1E1E1E" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="52" y="402" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#555555">@  TonPseudo (unique)</text>
  <text x="24" y="436" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" fill="#555555">Ton pseudo sera visible par les autres membres</text>

  <!-- Email field -->
  <text x="24" y="464" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9A9A9A">Email *</text>
  <rect x="24" y="474" width="342" height="48" rx="10" fill="#1E1E1E" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="52" y="504" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#555555">✉  ton@email.com</text>

  <!-- Password field -->
  <text x="24" y="546" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9A9A9A">Mot de passe *</text>
  <rect x="24" y="556" width="342" height="48" rx="10" fill="#1E1E1E" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="52" y="586" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#555555">🔒  Min. 8 caractères</text>
  <text x="24" y="620" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" fill="#555555">Au moins 8 caractères</text>

  <!-- Terms checkbox -->
  <rect x="24" y="644" width="20" height="20" rx="4" fill="#C5FF00"/>
  <text x="34" y="658" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="10" font-weight="900" fill="#0A0A0A" text-anchor="middle">✓</text>
  <text x="52" y="654" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" fill="#9A9A9A">J'accepte les </text>
  <text x="135" y="654" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#C5FF00">CGU</text>
  <text x="157" y="654" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" fill="#9A9A9A"> et la </text>
  <text x="52" y="672" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#C5FF00">Politique de confidentialité</text>

  <!-- Continue button -->
  <rect x="24" y="700" width="342" height="56" rx="16" fill="#C5FF00"/>
  <text x="175" y="734" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0A0A0A" text-anchor="middle">Continuer</text>
  <text x="252" y="734" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" fill="#0A0A0A">→</text>

  <!-- Footer -->
  <text x="140" y="780" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" fill="#9A9A9A">Déjà inscrit ?</text>
  <text x="248" y="780" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#C5FF00">Se connecter</text>

  <!-- Bottom indicator -->
  <rect x="147" y="818" width="96" height="5" rx="2.5" fill="#FFFFFF" opacity="0.2"/>
</svg>